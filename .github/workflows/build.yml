name: Build Android APK

on:
  workflow_dispatch:

# A new push supersedes whatever is still running for the same branch. Without
# this, every push queued ANOTHER full build; a dozen pushes in a day means a
# dozen queued runs fighting for the free-tier runners, which is why runs sit
# "in progress" for hours without compiling anything.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Without this the job inherits GitHub's 6-HOUR cap, so anything that
    # hangs burns six hours before failing instead of failing fast.
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install dependencies
        run: npm install

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Use consistent debug keystore (prevents signature conflict on re-install)
        run: |
          mkdir -p ~/.android
          cp .github/debug.keystore ~/.android/debug.keystore

      - name: Prebuild Android
        run: npx expo prebuild --platform android --no-install

      - name: Pin Razorpay standard-core to avoid JitPack metadata timeout
        run: |
          cat .github/scripts/razorpay-patch.gradle >> android/build.gradle
          echo "systemProp.org.gradle.internal.http.connectionTimeout=120000" >> android/gradle.properties
          echo "systemProp.org.gradle.internal.http.socketTimeout=120000" >> android/gradle.properties

      - name: Bundle JS
        run: |
          mkdir -p android/app/src/main/assets
          npx expo export:embed --platform android --dev false --entry-file index.ts --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx4g" || ./gradlew assembleDebug --no-daemon --refresh-dependencies

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RideApp-Customer
          path: android/app/build/outputs/apk/debug/*.apk