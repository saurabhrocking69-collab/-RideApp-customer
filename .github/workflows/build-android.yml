name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install NDK 27.1.12297006
        run: |
          for i in 1 2 3; do
            echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "ndk;27.1.12297006" && break
            echo "Retry $i — waiting 15s..."
            sleep 15
          done

      # Secret stored as raw JSON — write via env var to avoid shell-escaping issues.
      - name: Inject google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
          python3 -m json.tool google-services.json > /dev/null || (echo "ERROR: google-services.json is not valid JSON"; exit 1)
          echo "google-services.json OK: $(wc -c < google-services.json) bytes"

      - name: Expo Prebuild
        run: npx expo prebuild --platform android --clean
        env:
          CI: '1'

      - name: Verify google-services.json copied to android/app
        run: |
          ls -lh android/app/google-services.json \
            && echo "google-services.json present in android/app" \
            || (echo "ERROR: Missing from android/app — prebuild did not copy it"; exit 1)

      # Disable R8 — native modules (MMKV, maps, webview) lack proguard rules
      # and R8 strips their JNI bridge classes, crashing the app on startup.
      - name: Disable R8 minification in release build
        run: |
          python3 << 'PYEOF'
import re, os, sys

# Expo may generate Groovy DSL (build.gradle) or Kotlin DSL (build.gradle.kts)
for path in ['android/app/build.gradle.kts', 'android/app/build.gradle']:
    if os.path.exists(path):
        print(f'Found: {path}')
        with open(path) as f:
            content = f.read()
        # Groovy: minifyEnabled <expr>
        # Kotlin: isMinifyEnabled = <expr>
        patched = re.sub(r'minifyEnabled\s*=?\s*\S+', 'minifyEnabled false', content)
        patched = re.sub(r'isMinifyEnabled\s*=\s*\S+', 'isMinifyEnabled = false', patched)
        if patched == content:
            print(f'WARNING: minifyEnabled not found in {path}')
            print('Relevant lines:', [l for l in content.splitlines() if 'minify' in l.lower() or 'proguard' in l.lower()])
        else:
            with open(path, 'w') as f:
                f.write(patched)
            print(f'R8 disabled in {path}')
        break
else:
    print('ERROR: No build.gradle found', file=sys.stderr)
    sys.exit(1)
PYEOF

      # Generate a fresh keystore every build — alias and passwords are
      # hardcoded so there is never a secret/alias mismatch at sign time.
      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/release.keystore \
            -alias release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android123 -keypass android123 \
            -dname "CN=Sppero,O=Sppero,C=IN"

      # arm64-v8a = modern phones; armeabi-v7a = older/budget ARM32 devices
      - name: Build Release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$(pwd)/app/release.keystore" \
            -Pandroid.injected.signing.store.password="android123" \
            -Pandroid.injected.signing.key.alias="release" \
            -Pandroid.injected.signing.key.password="android123" \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a \
            --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sppero-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
