name: Build Android APK

# Manual only. EAS is the shipping path now, and its builds are signed with a
# different key than this workflow's — two build systems racing on every push
# means every install needs an uninstall first.
on:
  workflow_dispatch:

# A new push supersedes whatever is still running for the same branch. Without
# this, every push queued ANOTHER full build; a dozen pushes in a day means a
# dozen queued runs fighting for the free-tier runners, which is why runs sit
# "in progress" for hours without compiling anything.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    # Without this the job inherits GitHub's 6-HOUR cap, so anything that
    # hangs burns six hours before failing instead of failing fast.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          cache: 'gradle'
          java-version: '17'

      - name: Install NDK 27.1.12297006
        run: |
          for i in 1 2 3; do
            echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "ndk;27.1.12297006" && break
            echo "Retry $i — waiting 15s..."
            sleep 15
          done

      # Secret stored as raw JSON — write via env var to avoid shell-escaping issues.
      - name: Inject google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
          python3 -m json.tool google-services.json > /dev/null || (echo "ERROR: google-services.json is not valid JSON"; exit 1)
          echo "google-services.json OK: $(wc -c < google-services.json) bytes"

      - name: Expo Prebuild
        run: npx expo prebuild --platform android --clean
        env:
          CI: '1'

      # expo-updates runs a KSP (Kotlin Symbol Processing) step, and KSP loads a
      # large amount of class metadata. Expo's generated default is
      #   org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
      # which is not enough once expo-updates is in the graph — the build dies
      # with "[ksp] java.lang.OutOfMemoryError: Metaspace" on
      # :expo-updates:kspReleaseKotlin. Metaspace is NATIVE memory holding class
      # metadata, separate from the heap, so raising -Xmx alone does not help.
      # Appended after prebuild because prebuild regenerates gradle.properties;
      # duplicate keys in a properties file resolve to the last one written.
      - name: Raise Gradle/Kotlin memory for KSP
        run: |
          {
            echo ""
            echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8"
            echo "kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g"
          } >> android/gradle.properties
          tail -5 android/gradle.properties

      # plugins.gradle.org returned HTTP 429 (Too Many Requests) and failed the
      # whole build. The reason it is being asked for so much: Expo's generated
      # settings.gradle has a pluginManagement block with NO repositories{} in
      # it, and when that is absent Gradle falls back to gradlePluginPortal()
      # ALONE. So ordinary artifacts — kotlin-stdlib, gson, guava, javapoet —
      # that live on Maven Central were all being pulled from the plugin portal,
      # which rate-limits. Adding google() and mavenCentral() ahead of it means
      # only actual Gradle plugins ever touch the portal.
      # Patched after prebuild because prebuild regenerates settings.gradle.
      - name: Resolve plugin deps via Maven Central (avoids plugins.gradle.org 429)
        run: |
          sed -i 's|pluginManagement {|pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() }|' android/settings.gradle
          head -8 android/settings.gradle

      - name: Verify google-services.json copied to android/app
        run: |
          ls -lh android/app/google-services.json \
            && echo "google-services.json present in android/app" \
            || (echo "ERROR: Missing from android/app — prebuild did not copy it"; exit 1)

      # R8 strips expo-modules-core Kotlin internals (AnyTypeCache etc.) causing
      # NoClassDefFoundError at startup. Disable minification and print debug
      # info so we can see exactly what file/lines are being patched.
      - name: Disable R8 minification in release build
        run: |
          echo "=== build.gradle files found ==="
          find android -name "build.gradle*" | sort
          echo "=== patching ==="
          # Groovy DSL
          if [ -f android/app/build.gradle ]; then
            echo "--- minify lines before ---"
            grep -n "minify\|Proguard\|proguard\|R8" android/app/build.gradle || echo "(none found)"
            sed -i 's/minifyEnabled enableProguardInReleaseBuilds/minifyEnabled false/g' android/app/build.gradle
            sed -i 's/minifyEnabled true/minifyEnabled false/g' android/app/build.gradle
            echo "--- minify lines after ---"
            grep -n "minify\|Proguard\|proguard" android/app/build.gradle || echo "(none found)"
          fi
          # Kotlin DSL
          if [ -f android/app/build.gradle.kts ]; then
            echo "--- minify lines before (kts) ---"
            grep -n "minify\|Proguard\|proguard\|R8" android/app/build.gradle.kts || echo "(none found)"
            sed -i 's/isMinifyEnabled = true/isMinifyEnabled = false/g' android/app/build.gradle.kts
            sed -i 's/isMinifyEnabled =.*/isMinifyEnabled = false/g' android/app/build.gradle.kts
            echo "--- minify lines after (kts) ---"
            grep -n "minify\|Proguard\|proguard" android/app/build.gradle.kts || echo "(none found)"
          fi

      # This used to run keytool and mint a BRAND NEW keypair on every single
      # build. Android refuses to install an APK signed by a different key than
      # the copy already on the phone, so each build could only be installed by
      # uninstalling the last one — losing the app data every time, with nothing
      # on screen to explain it beyond "App not installed".
      #
      # The committed keystore is ours and, more to the point, the same one
      # every time.
      - name: Use the project's own keystore
        run: |
          cp .github/debug.keystore android/app/release.keystore
          keytool -list -v -keystore android/app/release.keystore -storepass android | grep -E "Owner|SHA256" | head -2

      # arm64-v8a = modern phones; armeabi-v7a = older/budget ARM32 devices
      - name: Build Release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$(pwd)/app/release.keystore" \
            -Pandroid.injected.signing.store.password="android" \
            -Pandroid.injected.signing.key.alias="androiddebugkey" \
            -Pandroid.injected.signing.key.password="android" \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a \
            --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sppero-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
