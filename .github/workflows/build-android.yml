name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install NDK 27.1.12297006
        run: |
          for i in 1 2 3; do
            echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "ndk;27.1.12297006" && break
            echo "Retry $i — waiting 15s..."
            sleep 15
          done

      # google-services.json is gitignored — inject from secret before prebuild
      # so Firebase initialises correctly at app startup.
      # Secret is stored as raw JSON (not base64) to avoid encoding issues.
      - name: Inject google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          python3 -c "
import os, json, sys
content = os.environ.get('GOOGLE_SERVICES_JSON', '')
if not content.strip():
    print('❌ GOOGLE_SERVICES_JSON secret is empty'); sys.exit(1)
try:
    d = json.loads(content)
except json.JSONDecodeError as e:
    print(f'❌ Invalid JSON: {e}'); sys.exit(1)
pkg = d['client'][0]['client_info']['android_client_info']['package_name']
print(f'Package in secret: {pkg}')
if pkg != 'com.saurabhspero.rideappmobile3':
    print(f'❌ Package mismatch — expected com.saurabhspero.rideappmobile3'); sys.exit(1)
with open('google-services.json', 'w') as f:
    json.dump(d, f, indent=2)
print(f'✅ google-services.json written ({len(content)} chars, package OK)')
"

      - name: Expo Prebuild
        run: npx expo prebuild --platform android --clean
        env:
          CI: '1'

      - name: Verify google-services.json copied to android/app
        run: |
          ls -lh android/app/google-services.json \
            && echo "✅ google-services.json present in android/app" \
            || (echo "❌ Missing from android/app — prebuild did not copy it"; exit 1)

      # Generate a fresh keystore every build — alias and passwords are
      # hardcoded so there is never a secret/alias mismatch at sign time.
      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/release.keystore \
            -alias release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android123 -keypass android123 \
            -dname "CN=Sppero,O=Sppero,C=IN"

      # arm64-v8a = modern phones; armeabi-v7a = older/budget ARM32 devices
      - name: Build Release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$(pwd)/app/release.keystore" \
            -Pandroid.injected.signing.store.password="android123" \
            -Pandroid.injected.signing.key.alias="release" \
            -Pandroid.injected.signing.key.password="android123" \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a \
            --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sppero-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
