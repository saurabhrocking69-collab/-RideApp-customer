name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install NDK 27.1.12297006
        run: |
          for i in 1 2 3; do
            echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "ndk;27.1.12297006" && break
            echo "Retry $i — waiting 15s..."
            sleep 15
          done

      # google-services.json is gitignored — inject from secret before prebuild
      # so Firebase initialises correctly at app startup.
      - name: Inject google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > google-services.json

      - name: Expo Prebuild
        run: npx expo prebuild --platform android --clean
        env:
          CI: '1'

      # Generate a fresh keystore every build — alias and passwords are
      # hardcoded so there is never a secret/alias mismatch at sign time.
      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/release.keystore \
            -alias release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android123 -keypass android123 \
            -dname "CN=Sppero,O=Sppero,C=IN"

      - name: Build Release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$(pwd)/app/release.keystore" \
            -Pandroid.injected.signing.store.password="android123" \
            -Pandroid.injected.signing.key.alias="release" \
            -Pandroid.injected.signing.key.password="android123" \
            -PreactNativeArchitectures=arm64-v8a \
            --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sppero-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
