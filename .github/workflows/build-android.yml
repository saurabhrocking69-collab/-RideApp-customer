name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm install

      - name: Align expo package versions to SDK 54
        run: npx expo install --fix

      - name: Expo Prebuild
        run: npx expo prebuild --platform android --clean --no-install
        env:
          EXPO_NO_TELEMETRY: 1

      - name: Force legacy native-lib packaging
        run: echo "expo.useLegacyPackaging=true" >> android/gradle.properties

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
        env:
          JAVA_OPTS: "-Xmx4g"

      - name: Sign APK with committed keystore
        run: |
          BUILD_TOOLS=$(ls $ANDROID_SDK_ROOT/build-tools/ | sort -V | tail -1)
          APKSIGNER=$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS/apksigner

          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          SIGNED=android/app/build/outputs/apk/release/app-release.apk

          # Expo may output as app-release.apk (debug-signed) instead of unsigned
          if [ ! -f "$UNSIGNED" ] && [ -f "$SIGNED" ]; then
            cp "$SIGNED" "$UNSIGNED"
          fi

          # Sign with the committed debug.keystore — same cert every build
          $APKSIGNER sign \
            --ks .github/debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --out "$SIGNED" \
            "$UNSIGNED"

          echo "APK size: $(du -sh $SIGNED)"
          $APKSIGNER verify --verbose "$SIGNED" | head -6

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sppero-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: build-${{ github.run_number }}
          name: "Sppero APK - Build ${{ github.run_number }}"
          body: |
            Auto-built from commit ${{ github.sha }}
            Download the APK below and install on Android.
          files: android/app/build/outputs/apk/release/app-release.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
