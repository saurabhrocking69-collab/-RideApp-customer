name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm install

      - name: Align expo package versions to SDK 54
        run: npx expo install --fix

      - name: Expo Prebuild
        run: npx expo prebuild --platform android --clean --no-install
        env:
          EXPO_NO_TELEMETRY: 1

      - name: Force legacy native-lib packaging
        run: echo "expo.useLegacyPackaging=true" >> android/gradle.properties

      - name: Build signed Release APK
        run: |
          KEYSTORE="$(realpath .github/debug.keystore)"
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$KEYSTORE" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android
        env:
          JAVA_OPTS: "-Xmx4g"

      - name: Verify APK is signed + show size
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          echo "APK size: $(du -sh $APK)"
          BUILD_TOOLS=$(ls $ANDROID_SDK_ROOT/build-tools/ | sort -V | tail -1)
          $ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS/apksigner verify --verbose $APK | head -10

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sppero-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: build-${{ github.run_number }}
          name: "Sppero APK - Build ${{ github.run_number }}"
          body: |
            Auto-built from commit ${{ github.sha }}
            Download the APK below and install on Android.
          files: android/app/build/outputs/apk/release/app-release.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
