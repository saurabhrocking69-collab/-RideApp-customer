name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install NDK 27.1.12297006
        run: |
          for i in 1 2 3; do
            echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "ndk;27.1.12297006" && break
            echo "Retry $i — waiting 15s..."
            sleep 15
          done

      - name: Expo Prebuild
        run: npx expo prebuild --platform android --clean
        env:
          CI: '1'

      - name: Setup signing keystore
        working-directory: android/app
        run: |
          if [ -n "${{ secrets.KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > sppero.keystore
          else
            keytool -genkeypair -v \
              -keystore sppero.keystore \
              -alias sppero-key \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass sppero123 -keypass sppero123 \
              -dname "CN=Sppero,O=Sppero,C=IN"
          fi

      - name: Build Release APK
        working-directory: android
        env:
          KS_PASS: ${{ secrets.KEY_STORE_PASSWORD }}
          K_PASS: ${{ secrets.KEY_PASSWORD }}
          K_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$(pwd)/app/sppero.keystore" \
            -Pandroid.injected.signing.store.password="${KS_PASS:-sppero123}" \
            -Pandroid.injected.signing.key.alias="${K_ALIAS:-sppero-key}" \
            -Pandroid.injected.signing.key.password="${K_PASS:-sppero123}" \
            -PreactNativeArchitectures=arm64-v8a \
            --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sppero-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
