<svg width="880" height="200" viewBox="0 0 880 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sGrad" x1="141" y1="28" x2="57" y2="168" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#FF2D78"/>
      <stop offset="48%"  stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#00D9A0"/>
    </linearGradient>
    <linearGradient id="sGlow" x1="141" y1="28" x2="57" y2="168" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#FF2D78" stop-opacity="0.6"/>
      <stop offset="48%"  stop-color="#FFD700" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00D9A0" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="bloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dotGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.88)"/>
    </linearGradient>
  </defs>

  <!-- ── Icon mark (200×200, dark bg) ─────────────── -->
  <rect x="0" y="0" width="200" height="200" rx="44" fill="#08081A"/>
  <!-- Pink ambient -->
  <ellipse cx="120" cy="75"  rx="60" ry="50" fill="#FF2D78" opacity="0.10"/>
  <!-- Green ambient -->
  <ellipse cx="78"  cy="130" rx="50" ry="42" fill="#00D9A0" opacity="0.08"/>

  <!-- S glow layer -->
  <path d="M 141,28 C 142,4 44,2 38,44 C 32,86 140,107 136,136 C 132,165 38,170 35,151"
        stroke="url(#sGlow)" stroke-width="34" fill="none"
        stroke-linecap="round" opacity="0.6" filter="url(#bloom)"/>
  <!-- S main -->
  <path d="M 141,28 C 142,4 44,2 38,44 C 32,86 140,107 136,136 C 132,165 38,170 35,151"
        stroke="url(#sGrad)" stroke-width="22" fill="none"
        stroke-linecap="round"/>
  <!-- S highlight -->
  <path d="M 141,28 C 142,4 44,2 38,44 C 32,86 140,107 136,136 C 132,165 38,170 35,151"
        stroke="rgba(255,255,255,0.22)" stroke-width="6" fill="none"
        stroke-linecap="round"/>

  <!-- Top terminal dot - yellow -->
  <circle cx="141" cy="28" r="13" fill="#FFD700" opacity="0.3" filter="url(#dotGlow)"/>
  <circle cx="141" cy="28" r="8"  fill="#FFD700"/>
  <circle cx="138" cy="25" r="2.5" fill="rgba(255,255,255,0.7)"/>

  <!-- Bottom terminal dot - green -->
  <circle cx="35" cy="151" r="13" fill="#00D9A0" opacity="0.3" filter="url(#dotGlow)"/>
  <circle cx="35" cy="151" r="8"  fill="#00D9A0"/>
  <circle cx="32" cy="148" r="2.5" fill="rgba(255,255,255,0.7)"/>

  <!-- Motion lines -->
  <line x1="8"  y1="96"  x2="22" y2="96"  stroke="#FF2D78" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="4"  y1="106" x2="20" y2="106" stroke="#FFD700" stroke-width="1.8" stroke-linecap="round" opacity="0.35"/>
  <line x1="6"  y1="86"  x2="20" y2="86"  stroke="#FF2D78" stroke-width="1.5" stroke-linecap="round" opacity="0.22"/>

  <!-- Icon border -->
  <rect x="0.75" y="0.75" width="198.5" height="198.5" rx="43.25" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- ── Wordmark ──────────────────────────────────── -->
  <!-- "SPPERO" main text -->
  <text x="240" y="132"
        font-family="'Arial Black', 'Impact', 'Helvetica Neue', Arial, sans-serif"
        font-weight="900"
        font-size="96"
        letter-spacing="8"
        fill="white"
        opacity="0.97">SPPERO</text>

  <!-- Pink underline / accent bar -->
  <rect x="240" y="148" width="76" height="5" rx="2.5" fill="#FF2D78" opacity="0.8"/>

  <!-- Tagline -->
  <text x="244" y="176"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-weight="400"
        font-size="18"
        letter-spacing="4.5"
        fill="rgba(255,255,255,0.45)">LUCKNOW KA SMARTEST RIDE</text>
</svg>
